---
features:
  - |
    ``PrometheusAPIClient`` now supports ``set_min_tls_version`` and
    ``set_max_tls_version`` to configure the TLS protocol version bounds used
    for HTTPS connections to Prometheus. Accepted values are ``1.2`` and
    ``1.3``, matching the spelling used by ``keystoneauth1``'s
    ``tls_min_version``.
